listen=YES
listen_ipv6=NO
anonymous_enable=NO
local_enable=YES
write_enable=YES
local_umask=022
dirmessage_enable=YES
use_localtime=YES
xferlog_enable=YES
connect_from_port_20=YES
xferlog_file=/var/log/vsftpd.log
xferlog_std_format=YES

# TLS/SSL
ssl_enable=yes
rsa_cert_file=/etc/ssl/ftps/servidor.crt
rsa_private_key_file=/etc/ssl/ftps/servidor.key
ssl_tlsv1=YES
ssl_sslv2=NO
ssl_sslv3=NO
force_local_logins_ssl=YES
force_local_data_ssl=YES
require_ssl_reuse=NO
ssl_ciphers=HIGH

# Modo pasivo
pasv_enable=YES
pasv_min_port=50000
pasv_max_port=50010
pasv_address=192.168.50.3

# Usuario local
pam_service_name=vsftpd
userlist_enable=YES
userlist_deny=NO
userlist_file=/etc/vsftpd.userlist
