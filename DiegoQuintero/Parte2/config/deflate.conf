<IfModule mod_deflate.c>

    DeflateCompressionLevel 9

    AddOutputFilterByType DEFLATE text/html text/plain text/xml application/xml text/css application/javascript text/javascript application/json image/svg+xml
    
    SetEnvIfNoCase Request_URI \.(?:gif|jpe?g|png|webp|mp4|avi|zip|gz|pdf)$ no-gzip dont-vary

</IfModule>

# vim: syntax=apache ts=4 sw=4 sts=4 sr noet
