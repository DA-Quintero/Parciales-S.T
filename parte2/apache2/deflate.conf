<IfModule mod_deflate.c>
    DeflateCompressionLevel 9

    AddOutputFilterByType DEFLATE text/html text/plain text/xml \
        text/css application/javascript text/javascript application/x-javascript \
        application/json image/svg+xml application/xml

    # Excluir binarios ya comprimidos (imágenes, video, zip)
    SetEnvIfNoCase Request_URI \.(?:gif|jpe?g|png|webp|mp4|avi|zip|gz|pdf)$ \
        no-gzip dont-vary
</IfModule>
