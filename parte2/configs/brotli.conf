<IfModule mod_brotli.c>
    # Niveles de calidad evaluados: 5 (balance óptimo) y 11 (máximo costo de CPU)
    BrotliCompressionQuality 5
    BrotliCompressionWindow 22

    # Tipos MIME a comprimir
    AddOutputFilterByType BROTLI_COMPRESS text/html text/plain text/xml text/css application/javascript application/json image/svg+xml

    # Exclusión explícita de binarios ya comprimidos
    SetEnvIfNoCase Request_URI \.(?:gif|jpe?g|png|webp|mp4|avi|zip|gz|pdf)$ no-brotli dont-vary
</IfModule>
